# Optional: Docker Compose for local development/testing
# Note: Hugging Face Spaces will use the Dockerfile directly
version: '3.8'

services:
  ml-stack:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"  # Streamlit UI
      - "8000:8000"  # FastAPI (for local testing)
      - "5000:5000"  # MLflow (for local testing)
      - "9100:9100"  # Prometheus (for local testing)
    volumes:
      - ./data:/data
      - ./mlflow:/mlflow
      - ./logs:/logs
    environment:
      - MLFLOW_TRACKING_URI=http://localhost:5000
      - FASTAPI_URL=http://localhost:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
