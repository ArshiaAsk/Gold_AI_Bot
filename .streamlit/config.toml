[theme]
primaryColor = "#FFD700"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#262730"
textColor = "#fafafa"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"
logger.level = "info"

[server]
port = 8501
headless = true
runOnSave = true
maxUploadSize = 200
enableXsrfProtection = true

[logger]
level = "info"
messageFormat = "%(asctime)s [%(levelname)s] %(message)s"

[browser]
gatherUsageStats = false
serverAddress = "localhost"
