version: '3.8'

# ============================================================================
# Streamlined Stack for Hugging Face Spaces / Docker Hub Deployment
# Only essential services: Streamlit + API (optional backend)
# ============================================================================

services:
  # ========================================================================
  # STREAMLIT UI - Main User Interface
  # ========================================================================
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: gold-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit_app.py:/app/streamlit_app.py
      - ./src:/app/src
      - ./api_layer:/app/api_layer
      - ./config:/app/config
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - API_URL=${API_URL:-http://api:8000}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gold-net

  # ========================================================================
  # FASTAPI BACKEND (Optional - can be disabled)
  # ========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gold-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - LOG_LEVEL=INFO
      - CORS_ALLOW_ORIGINS=http://localhost:8501,http://streamlit:8501
      - API_KEY_REQUIRED=false
      - RATE_LIMIT_ENABLED=true
      - AUDIT_DB_PATH=data/mlops_audit.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gold-net

networks:
  gold-net:
    driver: bridge

# ============================================================================
# USAGE FOR HUGGING FACE:
# ============================================================================
# This compose file is optimized for Docker Hub deployment
# 
# 1. Build images:
#    docker-compose -f docker-compose.hf.yml build
#
# 2. Push to Docker Hub:
#    docker tag gold-streamlit:latest YOUR_USERNAME/gold-price-predictor:latest
#    docker push YOUR_USERNAME/gold-price-predictor:latest
#
# 3. On Hugging Face Spaces:
#    - Use Docker SDK
#    - Reference image: YOUR_USERNAME/gold-price-predictor:latest
#    - Expose port 8501
#
# ============================================================================
