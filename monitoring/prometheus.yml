global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: gold-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']

  - job_name: gold-mlops-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['mlops-worker:8001']
