groups:
  - name: mlops-alerts
    rules:
      - alert: HighApiErrorRate
        expr: increase(api_errors_total[10m]) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API error rate is elevated
          description: More than 20 API errors were recorded in the last 10 minutes.

      - alert: DriftDetected
        expr: increase(model_drift_detected_total[1h]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Data drift detected
          description: Drift detector reported at least one drift event in the last hour.
