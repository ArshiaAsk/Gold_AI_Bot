[supervisord]
nodaemon=true
user=%(ENV_USER_ID)s
logfile=/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/logs
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ========================================
# Service 1: Streamlit UI (Primary - Port 7860)
# ========================================
[program:streamlit]
command=streamlit run streamlit_app.py --server.port=7860 --server.address=0.0.0.0
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
stopwaitsecs=10

# ========================================
# Service 2: FastAPI Model API (Internal - Port 8000)
# ========================================
[program:fastapi]
command=uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers 2 --log-level info
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
stopwaitsecs=10

# ========================================
# Service 3: MLflow Tracking Server (Internal - Port 5000)
# ========================================
[program:mlflow]
command=mlflow server --backend-store-uri sqlite:///%(ENV_DATA_HOME)s/mlflow.db --default-artifact-root %(ENV_MLFLOW_HOME)s/artifacts --host 0.0.0.0 --port 5000
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
stopwaitsecs=10
environment=MLFLOW_TRACKING_URI="http://localhost:5000"

# ========================================
# Service 4: MLOps Worker (Background Tasks)
# ========================================
[program:mlops-worker]
command=python -m src.mlops.worker
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
stopwaitsecs=30
environment=MLFLOW_TRACKING_URI="http://localhost:5000"

# ========================================
# Service 5: Prometheus Node Exporter (Optional - Port 9100)
# ========================================
[program:prometheus-exporter]
command=python -m src.monitoring.prometheus_exporter
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=50
stopwaitsecs=5

# ========================================
# Event Listeners for Enhanced Monitoring
# ========================================
[eventlistener:processes]
command=python -m src.monitoring.supervisor_listener
events=PROCESS_STATE,TICK_60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
